name: CI and Docker Hub

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Format, vet, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: migration_test
          POSTGRES_PASSWORD: migration-test-only
          POSTGRES_DB: sea_codex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_test -d sea_codex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PDF processing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Verify source
        run: make check

      - name: Verify PostgreSQL migrations and application flows
        env:
          TEST_POSTGRES_DSN: postgres://migration_test:migration-test-only@127.0.0.1:5432/sea_codex_test?sslmode=disable
        run: go test -count=1 ./internal/auth/migrations ./internal/bootstrap

      - name: Verify evaluation metrics
        run: python3 -m unittest discover -s scripts/evaluation

  container:
    name: Build and check container
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: sea-codex-server:ci
          cache-from: type=gha,scope=sea-codex-image
          cache-to: type=gha,mode=max,scope=sea-codex-image

      - name: Check API help exit code
        run: docker run --rm sea-codex-server:ci --help

      - name: Check runtime identity and directory permissions
        run: |
          docker run --rm --entrypoint /bin/sh sea-codex-server:ci -euxc '
            id
            ls -ld /app /app/config /app/config/app.yaml /app/storage /app/storage/uploads
            test "$(id -u)" = "10001"
            test -x /app/config
            test -r /app/config/app.yaml
            test -w /app/storage/uploads
          '

  publish:
    name: Publish multi-platform image
    needs: [test, container]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Configure repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY || 'sea-codex-server' }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=long
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sea-codex-image
          cache-to: type=gha,mode=max,scope=sea-codex-image
