# Runtime secrets must be supplied via environment variables.
http_server:
  host: 0.0.0.0
  port: 8080
  mode: release
  log_level: info
  read_timeout: 120s
  read_header_timeout: 5s
  write_timeout: 120s
  idle_timeout: 60s
  shutdown_timeout: 10s

postgres:
  host: postgres
  port: 5432
  user: sea_codex
  password: ""
  dbname: sea_codex
  sslmode: require
  connect_timeout: 5s
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m
  auto_migrate: false

auth:
  private_key_hex: ""
  public_key_hex: ""
  token_duration: 24h
  request_limit: 20
  rate_window: 1m

# Local/private file storage. Keep this directory on a persistent volume.
uploads:
  directory: /app/storage/uploads
  max_file_size_mb: 20
  max_files_per_request: 10
  max_pdf_pages: 100

# Set model/key explicitly. Background processing is opt-in.
processing:
  enabled: false
  provider: openai-compatible
  base_url: https://api.openai.com
  api_key: ""
  model: ""
  poll_interval: 2s
  max_concurrent_files: 3
  timeout: 90s
  lease_duration: 5m
  max_page_dimension: 1600

# Independent of OCR. Guides remain available with AI disabled.
assistant:
  enabled: false
  base_url: https://api.openai.com
  api_key: ""
  model: ""
  timeout: 30s
  max_output_tokens: 1500
  request_limit: 10
  rate_window: 1m
  max_concurrent_requests: 4
