# Runtime secrets must be supplied via environment variables.
http_server:
  host: 0.0.0.0
  port: 8080
  mode: release
  log_level: info
  read_timeout: 15s
  read_header_timeout: 5s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s

postgres:
  host: postgres
  port: 5432
  user: sea_codex
  password: ""
  dbname: sea_codex
  sslmode: require
  connect_timeout: 5s
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m

auth:
  private_key_hex: ""
  public_key_hex: ""
  token_duration: 24h
